<!DOCTYPE html>
  <html>
    <head>
      <link href="css/piano.css" rel="stylesheet">
      <title>
        Melodic Meadows
      </title>
    </head>
    
    <body>
      <div class="title-screen">
        <div class="title-box">
          <h1 class="title-main">Melodic Meadows</h1>
          <h2 class="title-sub">Triolet Tulips</h2>
          <div class="title-buttons">
            <button class="title-btn" id="play-btn">Play</button>
            <a class="title-btn" href="../index.html">Home</a>
          </div>
        </div>
      </div>
      
      <div class="clear-garden-btn">
        <img src="images/clear_button.png" class="clear-icon" alt="clear garden" />
      </div>
      <button class="settings-btn" aria-label="Settings">
        <img src="images/settings button.png" alt=""/>
      </button>
      
      <div class="garden-area"></div>
      <div class="piano-container">
        <img src="images/piano.png" class="piano-art">
      </div>

      <div class="chord-sprite sprite-hidden">
        <img src="" class="sprite-art" alt="" />
      </div>
      <div class="speech-container speech-hidden">
          <img src="" class="chord-speech-bubble" alt=""/>
          <span class="chord-speech-text"></span>
      </div>

      <div class = "journal-panel">
        <div class="journal-top">
        <div class="journal-tab-hit"></div>
        </div>
        <div class="journal-content">
          <button class="journal-close">x</button>
          <div class="journal-sections"></div>
        </div>
      </div>
      <script src="js/keys.js"></script>
    </body>
  </html>
